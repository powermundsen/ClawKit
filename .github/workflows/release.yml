name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Validate tag
        run: |
          package_version="$(python -c 'import sys; sys.path.insert(0, "src"); import clawkit; print(clawkit.__version__)')"
          test "${GITHUB_REF_NAME}" = "v${package_version}"
      - name: Require immutable-release gate
        env:
          IMMUTABLE_RELEASES_ENABLED: ${{ vars.CLAWKIT_IMMUTABLE_RELEASES_ENABLED }}
        run: |
          test "${IMMUTABLE_RELEASES_ENABLED}" = "true" || {
            echo "Set CLAWKIT_IMMUTABLE_RELEASES_ENABLED=true only after repository release immutability is enabled." >&2
            exit 1
          }
      - name: Test and scan
        env:
          PYTHONPATH: src
        run: |
          python installer/privacy-scan.py --history
          python -m unittest discover -s tests -v
      - name: Build
        run: bash installer/build-release.sh "${GITHUB_REF_NAME#v}" dist
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=()
          case "${GITHUB_REF_NAME}" in *-*) prerelease=(--prerelease) ;; esac
          gh release create "${GITHUB_REF_NAME}" dist/* \
            --draft --verify-tag --generate-notes \
            --title "ClawKit ${GITHUB_REF_NAME#v}" \
            "${prerelease[@]}"
          gh release edit "${GITHUB_REF_NAME}" --draft=false
